<style>
:root{--aqua:#7b3fa0;--pc:#e0a800;--tq:#2e9e3a;--common:#1f6fd1;--ink:#1d1b22;--muted:#6b6875;--bg:#fff;--line:#e6e3ea;
  --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);overflow:hidden}
#map{position:absolute;inset:0;background:#cfe0c9}
#top{position:absolute;left:0;right:0;top:0;z-index:1000;padding:calc(var(--safe-top) + 8px) 10px 0;pointer-events:none}
#top>*{pointer-events:auto}
.searchbox{display:flex;align-items:center;background:var(--bg);border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.18);padding:0 6px 0 12px}
.searchbox input{flex:1;border:0;outline:0;font-size:16px;padding:12px 4px;background:transparent;min-width:0}
.searchbox button{border:0;background:none;font-size:18px;padding:8px;color:var(--muted)}
#chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;background:var(--bg);box-shadow:0 1px 6px rgba(0,0,0,.15);padding:7px 12px;font-size:14px;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--aqua);color:#fff}
#banner{display:none;margin-top:4px;background:#fff8e1;border:1px solid #f0d58a;border-radius:10px;padding:6px 10px;font-size:13px;box-shadow:0 1px 6px rgba(0,0,0,.1)}
#fabs{position:absolute;right:10px;z-index:1000;display:flex;flex-direction:column;gap:8px;bottom:calc(var(--sheet-h,120px) + 12px);transition:bottom .2s}
.fab{width:46px;height:46px;border-radius:50%;border:0;background:var(--bg);box-shadow:0 2px 10px rgba(0,0,0,.2);font-size:20px;display:flex;align-items:center;justify-content:center}
.fab.on{background:#e3f0ff}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:1001;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -2px 16px rgba(0,0,0,.18);
  max-height:48vh;display:flex;flex-direction:column;padding-bottom:var(--safe-bot)}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:#d4d0da;margin:8px auto 4px;flex:none}
#sheet .body{overflow-y:auto;padding:4px 14px 12px;-webkit-overflow-scrolling:touch}
#sheet.min .body{max-height:84px;overflow:hidden}
h2{font-size:18px;margin:4px 0 6px}
.hint{color:var(--muted);font-size:14px;margin:2px 0 8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .dot{flex:none;width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--muted)}
.row .walk{flex:none;text-align:right;font-weight:700;font-size:15px}
.row .walk small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;color:#fff;margin-right:4px;vertical-align:1px}
.open{color:#1a8a3a;font-weight:600}.closed{color:#b3261e;font-weight:600}
.btns{display:flex;gap:8px;margin:10px 0 4px}
.btn{flex:1;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:600;background:#efeaf4;color:var(--ink)}
.btn.primary{background:var(--aqua);color:#fff}
ol.steps{margin:6px 0 0;padding-left:22px}ol.steps li{padding:5px 0;border-top:1px solid var(--line)}ol.steps li:first-child{border-top:0}
.note{background:#f6f3f9;border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.navhead{background:var(--aqua);color:#fff;border-radius:12px;padding:10px 12px;margin:4px 0 8px;font-size:16px;font-weight:600}
.navhead small{display:block;font-weight:400;opacity:.85;font-size:13px}
/* map markers */
.pin{border-radius:50%;color:#fff;font:700 11px/1 -apple-system,sans-serif;display:flex;align-items:center;justify-content:center;
  border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);width:22px;height:22px;transition:transform .15s,opacity .15s}
.pin.dim{opacity:.28;transform:scale(.8)}
.pin.hit{transform:scale(1.45);z-index:1000;animation:pulse 1.6s infinite}
.pin.sel{transform:scale(1.7);outline:3px solid #fff;box-shadow:0 0 0 5px rgba(0,0,0,.35)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(123,63,160,.7)}70%{box-shadow:0 0 0 14px rgba(123,63,160,0)}100%{box-shadow:0 0 0 0 rgba(123,63,160,0)}}
.homelbl{background:var(--aqua);color:#fff;font-weight:700;font-size:12px;padding:3px 7px;border-radius:8px;white-space:nowrap;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.35),0 1px 6px rgba(0,0,0,.4)}
.cone{position:absolute;left:-21px;top:-38px;width:60px;height:60px;transform-origin:30px 47px;pointer-events:none}
#layers{display:none;position:absolute;right:64px;z-index:1002;background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(0,0,0,.25);padding:12px 14px;width:230px;font-size:14px}
#layers label{display:flex;align-items:center;gap:8px;padding:5px 0}
#layers input[type=range]{width:100%}
.legend{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center;font-size:12.5px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.leaflet-control-attribution{font-size:9px}
/* tonight */
.chip.tn{background:#1d2a5c;color:#fff}.chip.tn.on{background:#f5b301;color:#1d2a5c}
.row .time{flex:none;width:50px;font-weight:700;font-size:15px}.row .time small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.row.past{opacity:.45}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:4px;background:#1a8a3a;color:#fff;vertical-align:1px}
.badge.next{background:#f5b301;color:#1d2a5c}
.actlbl{background:#1d2a5c;color:#fff;font:700 11px/1.2 -apple-system,sans-serif;padding:2px 6px;border-radius:7px;white-space:nowrap;border:1.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.actlbl.live{background:#1a8a3a}
.daynav{display:flex;align-items:center;gap:8px;margin:0 0 6px}.daynav h2{flex:1;margin:0}
.daynav button{border:0;background:#efeaf4;border-radius:10px;padding:6px 12px;font-size:16px;color:var(--ink)}.daynav button:disabled{opacity:.3}
.actbox{background:#1d2a5c;color:#fff;border-radius:12px;padding:10px 12px;margin:4px 0 8px;font-size:15px}
.actbox small{display:block;opacity:.85;font-size:13px;margin-top:2px}
.tnote{display:flex;align-items:center;gap:8px;background:#1d2a5c;color:#fff;border-radius:12px;padding:9px 12px;margin:8px 0;font-size:14px}
.tnote span{flex:1}.tnote button{border:0;border-radius:9px;background:#f5b301;color:#1d2a5c;font-weight:700;padding:7px 10px;font-size:14px}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div class="searchbox">
    <span>🔎</span>
    <input id="q" type="search" placeholder="Where to? gym, buffet, bar, towels…" autocomplete="off" enterkeyhint="search">
    <button id="qclear" aria-label="Clear" style="display:none">✕</button>
  </div>
  <div id="chips"></div>
  <div id="banner"></div>
</div>

<div id="fabs">
  <button class="fab" id="bLayers" aria-label="Map layers">🗺️</button>
  <button class="fab" id="bCompass" aria-label="Compass">🧭</button>
  <button class="fab" id="bHome" aria-label="My room">🏠</button>
  <button class="fab" id="bLocate" aria-label="My location">📍</button>
</div>

<div id="layers">
  <b>Background</b>
  <label><input type="radio" name="base" value="sat" checked> Satellite</label>
  <label><input type="radio" name="base" value="osm"> Street map</label>
  <label><input type="radio" name="base" value="none"> None (works offline)</label>
  <label><input type="checkbox" id="ovOn" checked> Hotel map on top</label>
  <input type="range" id="ovOp" min="0" max="100" value="80" aria-label="Hotel map opacity">
  <div class="legend">
    <i style="background:var(--aqua)"></i><span>Escape Aquamarine (your hotel)</span>
    <i style="background:var(--pc)"></i><span>Explore Punta Cana</span>
    <i style="background:var(--tq)"></i><span>Explore Turquesa</span>
    <i style="background:var(--common)"></i><span>Common areas</span>
    <i style="background:#bbb"></i><span>Red / teal / pink areas aren't in your package</span>
  </div>
</div>

<div id="sheet" class="min">
  <div class="grab"></div>
  <div class="body" id="sheetBody"></div>
</div>

<script>

const SEC = {aqua:{n:'Aquamarine',c:'var(--aqua)',h:'#7b3fa0'},pc:{n:'Punta Cana',c:'var(--pc)',h:'#e0a800'},
             tq:{n:'Turquesa',c:'var(--tq)',h:'#2e9e3a'},common:{n:'Common',c:'var(--common)',h:'#1f6fd1'}};

  ['services','ℹ️ Guest service',['guest service','tour','excursion','info','help','reservations']],
];
const EMOJI = {buffet:'🍽',restaurant:'🍷',bar:'🍹',pool:'🏊',beach:'🏖',gym:'💪',lobby:'🛎',towels:'🧺',train:'🚂',atm:'$',shop:'🛍',
  entertainment:'🎭',snacks:'🌮',spa:'💆',sports:'🎾',kids:'🧒',medical:'✚',services:'i',food:'🍽'};
const WALK_M_PER_MIN = 75;

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- room number (kept on the phone; set via #room=1234 or by tapping the house) ----------
(function(){ const m = location.hash.match(/room=(\w+)/); if (m) { localStorage.setItem('room', m[1]); history.replaceState(null,'',location.pathname); } })();
const room = () => localStorage.getItem('room') || '';

// ---------- geometry ----------
const KLAT = 110574, KLON = 111320*Math.cos(18.723*Math.PI/180);
const dist = (a,b) => Math.hypot((a[0]-b[0])*KLAT, (a[1]-b[1])*KLON);
const bearing = (a,b) => (Math.atan2((b[1]-a[1])*KLON, (b[0]-a[0])*KLAT)*180/Math.PI + 360) % 360;
function projSeg(p,a,b){ // closest point on segment a-b to p (local metric plane)
  const ax=a[1]*KLON, ay=a[0]*KLAT, bx=b[1]*KLON, by=b[0]*KLAT, px=p[1]*KLON, py=p[0]*KLAT;
  const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy; let t = L ? ((px-ax)*dx+(py-ay)*dy)/L : 0; t=Math.max(0,Math.min(1,t));
  const q=[(ay+t*dy)/KLAT,(ax+t*dx)/KLON]; return {q, t, d: dist(p,q)};
}

// ---------- walking graph ----------
const N = D.graph.n, E = D.graph.e, ADJ = N.map(()=>[]);
E.forEach(([a,b]) => { const w = dist(N[a],N[b]); ADJ[a].push([b,w]); ADJ[b].push([a,w]); });
function snap(p){ let best=null; for (let i=0;i<E.length;i++){ const [a,b]=E[i]; const r=projSeg(p,N[a],N[b]); if(!best||r.d<best.d) best={...r,a,b}; } return best; }
D.places.forEach(pl => pl.snap = snap(pl.ll));
const GSNAP_HOME = snap(D.home.ll);

function dijkstra(src){ // src = snap result; returns {dist, prev}
  const n=N.length, dd=new Float64Array(n).fill(Infinity), prev=new Int32Array(n).fill(-1);
  const heap=[]; const push=(d,i)=>{heap.push([d,i]);let k=heap.length-1;while(k){const p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;[heap[p],heap[k]]=[heap[k],heap[p]];k=p;}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let k=0;for(;;){let l=2*k+1,r=l+1,m=k;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m;}}return top;};
  const da=dist(src.q,N[src.a]), db=dist(src.q,N[src.b]);
  dd[src.a]=da; dd[src.b]=Math.min(dd[src.b],db); push(da,src.a); push(db,src.b); prev[src.a]=-2; prev[src.b]=-2;
  while(heap.length){ const [d,u]=pop(); if(d>dd[u]) continue; for(const [v,w] of ADJ[u]){ const nd=d+w; if(nd<dd[v]){dd[v]=nd;prev[v]=u;push(nd,v);} } }
  return {dist:dd, prev};
}
function routeTo(start, T, pl){ // returns {meters, coords[], tail[]}
  const s = pl.snap; let best=null;
  for (const [end, other] of [[s.a,s.b],[s.b,s.a]]) {
    const m = T.dist[end] + dist(N[end], s.q);
    if (!best || m < best.m) best = {m, end};
  }
  // same edge as start: walk straight along it
  const sameEdge = (start.snap.a===s.a && start.snap.b===s.b) || (start.snap.a===s.b && start.snap.b===s.a);
  let coords;
  if (sameEdge && dist(start.snap.q, s.q) <= best.m) { coords=[start.snap.q, s.q]; best.m = dist(start.snap.q, s.q); }
  else { const path=[]; let u=best.end; while(u>=0){ path.push(N[u]); u=T.prev[u]; } path.reverse(); coords=[start.snap.q, ...path, s.q]; }
  const head = start.ll && dist(start.ll, start.snap.q) > 3 ? [start.ll, start.snap.q] : null;
  const tail = dist(s.q, pl.ll) > 3 ? [s.q, pl.ll] : null;
  const meters = best.m + (head? dist(...head):0) + (tail? dist(...tail):0);
  return {meters, coords, head, tail};
}

// ---------- hours (resort time = America/Santo_Domingo, UTC-4) ----------
function nowMin(){ const s=new Date().toLocaleTimeString('en-GB',{timeZone:'America/Santo_Domingo',hour12:false,hour:'2-digit',minute:'2-digit'}); const [h,m]=s.split(':').map(Number); return (h%24)*60+m; }
const toMin = s => { const [h,m]=s.split(':').map(Number); return h*60+m; };
function status(pl){
  if (!pl.hours) return null;
  const t=nowMin(); let next=null;
  for (const [a,b,lbl] of pl.hours){ const A=toMin(a), B=toMin(b);
    const open = B>A ? (t>=A && t<B) : (t>=A || t<B);
    if (open) return {open:true, txt:`Open${lbl?' for '+lbl.toLowerCase():''} until ${b}`};
    const until=(A-t+1440)%1440; if(!next||until<next.until) next={until,a,lbl}; }
  return {open:false, txt:`Closed · opens ${next.a}${next.lbl?' ('+next.lbl.toLowerCase()+')':''}`};
}
const hoursText = pl => pl.hours ? pl.hours.map(([a,b,l])=>(l?l+' ':'')+a+'–'+b).join(' · ') : '';

// ---------- map ----------

let me = null, meMarker = null, accCircle = null, follow = false, heading = null;
const START_HOME = () => ({ll:null, snap:GSNAP_HOME, home:true});
function startPoint(){
  if (me && me.acc < 120) { const s = snap(me.ll); if (s.d < 250) return {ll:me.ll, snap:s, home:false}; }
  return START_HOME();
}
function setBanner(html){ const b=$('#banner'); b.style.display = html?'block':'none'; b.innerHTML = html||''; }
function gpsBanner(){
  if (!me) return setBanner(gpsErr || 'Finding your location… Directions start from your room until GPS is ready.');
  const s = snap(me.ll);
  if (s.d >= 250) return setBanner('📍 You appear to be outside the resort, so directions start from your room (Bldg 80).');
  if (me.acc >= 120) return setBanner(`📍 GPS is weak (±${Math.round(me.acc)} m). Directions start from your room for now.`);
  setBanner('');
}
let gpsErr = '';
function onPos(p){
  me = {ll:[p.coords.latitude, p.coords.longitude], acc:p.coords.accuracy};
  if (p.coords.heading != null && !isNaN(p.coords.heading) && p.coords.speed > 0.6) setHeading(p.coords.heading);
  if (!meMarker){
    accCircle = L.circle(me.ll,{radius:me.acc,color:'#1a73e8',weight:1,fillOpacity:.12,interactive:false}).addTo(map);
    meMarker = L.marker(me.ll,{icon:L.divIcon({className:'',iconSize:[18,18],iconAnchor:[9,9],
      html:'<svg class="cone" id="cone" viewBox="0 0 60 60" style="display:none"><path d="M30 47 L12 8 A40 40 0 0 1 48 8 Z" fill="rgba(26,115,232,.28)"/></svg><div class="me"></div>'}),
      zIndexOffset:1000, interactive:false}).addTo(map);
  } else { meMarker.setLatLng(me.ll); accCircle.setLatLng(me.ll).setRadius(me.acc); }
  if (follow) map.panTo(me.ll);
  gpsBanner();
  if (current && current.nav) maybeReroute();
}
function onPosErr(e){

function matchPlaces(q){
  if (q.cat) return D.places.filter(p => p.cats.includes(q.cat));
  const s = q.text.trim().toLowerCase(); if (!s) return [];
  const cats = new Set(CATS.filter(([k,l,syn]) => syn.some(w => w.startsWith(s) || s.includes(w)) || l.toLowerCase().includes(s)).map(c=>c[0]));
  if (/room|home|hotel room|bldg|building 80/.test(s)) return [HOME];
  return D.places.filter(p => p.name.toLowerCase().includes(s) || p.cats.some(c => cats.has(c)));
}
function highlight(list, sel){
  const ids = new Set(list.map(p=>p.id));
  D.places.forEach(pl => { const m=markers.get(pl.id), hit=ids.has(pl.id);
    if (pl.cats.includes('train')) { if (hit) m.addTo(map); else map.removeLayer(m); }

function runQuery(q){

// ---------- directions ----------
function drawRoute(r, pl, fit=true){
  routeLayer.clearLayers();
  const line = [...(r.head?[r.head[0]]:[]), ...r.coords];
  L.polyline(line,{color:'#fff',weight:9,opacity:.9}).addTo(routeLayer);
  L.polyline(line,{color:'#1a73e8',weight:5.5,opacity:1}).addTo(routeLayer);
  if (r.tail) L.polyline(r.tail,{color:'#1a73e8',weight:4,dashArray:'4 8'}).addTo(routeLayer);
  if (fit) fitTo([...line, pl.ll]);
}
function compass(b){ return ['north','northeast','east','southeast','south','southwest','west','northwest'][Math.round(b/45)%8]; }
function beachHint(b){ const d=((b-48)+540)%360-180; return Math.abs(d)<35 ? ' (toward the beach)' : Math.abs(d)>145 ? ' (away from the beach)' : ''; }
function steps(r, pl){
  const pts = [...(r.head?[r.head[0]]:[]), ...r.coords, ...(r.tail?[r.tail[1]]:[])].filter((p,i,a)=>!i||dist(p,a[i-1])>0.5);
  if (pts.length<2) return [`You're there — ${pl.name}.`];
  const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+dist(pts[i-1],pts[i]));
  const at = m => { let i=1; while(i<pts.length-1 && cum[i]<m) i++; const f=(m-cum[i-1])/Math.max(1e-9,cum[i]-cum[i-1]);
    return [pts[i-1][0]+(pts[i][0]-pts[i-1][0])*Math.min(1,Math.max(0,f)), pts[i-1][1]+(pts[i][1]-pts[i-1][1])*Math.min(1,Math.max(0,f))]; };
  const total = cum[cum.length-1], out=[]; let legStart=0;
  out.push({txt:`Head ${compass(bearing(pts[0], at(Math.min(12,total))))}${beachHint(bearing(pts[0], at(Math.min(12,total))))}`, from:0});
  for (let i=1;i<pts.length-1;i++){
    const m=cum[i]; if (m-legStart<10 || total-m<6) continue;
    const bin=bearing(at(Math.max(0,m-10)), pts[i]), bout=bearing(pts[i], at(Math.min(total,m+10)));
    const turn=((bout-bin)+540)%360-180;
    if (Math.abs(turn)>=45){ out.push({txt: Math.abs(turn)>140 ? 'Turn around' : (turn>0?'Turn right':'Turn left'), from:m}); legStart=m; }
  }
  return out.map((s,i) => { const len=(i+1<out.length?out[i+1].from:total)-s.from; return `${s.txt} and walk ${Math.max(5,Math.round(len/5)*5)} m`; })
            .concat(`Arrive at <b>${esc(pl.name)}</b>${r.tail?' (just off the path)':''}`);
}
function showPlace(pl, nav=false){

  else highlight([]);

  const arrived = !st.home && r.meters < 20;
  setSheet(`${nav ? `<div class="navhead">${arrived ? '🎉 You have arrived' : esc(steps(r,pl)[0].replace(/<[^>]+>/g,''))}<small>${mins} min · ${Math.round(r.meters)} m to ${esc(pl.name)}</small></div>` : ''}
    ${A ? `<div class="actbox">🌙 <b>${esc(A.title)}</b> · ${esc(actTimeText(A))}<small>${esc(actState(A, actCtx.ds).txt)}${A.note?' · '+esc(A.note):''}</small></div>` : ''}
    <h2>${esc(pl.name)}</h2>
    <div class="sub"><span class="tag" style="background:${SEC[pl.sec].h}">${SEC[pl.sec].n}</span>
      ${s?`<span class="${s.open?'open':'closed'}">${esc(s.txt)}</span>`:''}</div>
    ${pl.hours?`<div class="hint">Hours: ${esc(hoursText(pl))}</div>`:''}
    <div class="hint"><b>${mins} min walk</b> · ${Math.round(r.meters)} m from ${st.home?'your room (Bldg 80)':'your location'}</div>
    ${pl.note?`<div class="note">${esc(pl.note)}</div>`:''}
    <div class="btns">
      ${pl===HOME ? `<button class="btn" id="setRoom">Set room #</button>` : ''}
      ${nav ? `<button class="btn" id="stopNav">End directions</button>` : `<button class="btn primary" id="goNav">▶ Start directions</button>`}
      <button class="btn" id="back">${inTonight?'Back to tonight':activeCat||$('#q').value?'Back to list':'Close'}</button>
    </div>
    <b>Directions</b><ol class="steps">${steps(r,pl).map(x=>`<li>${x}</li>`).join('')}</ol>
    <div class="hint" style="margin-top:8px">Routes follow the resort's mapped paths; follow the blue line on the map. Hours are from the hotel guide and can change, so check the screens in the lobby.</div>`, nav);
  if ($('#goNav')) $('#goNav').onclick = () => { follow = !!me; $('#bLocate').classList.toggle('on', follow); if (me) map.setView(me.ll, 19); showPlace(pl, true); };
  if ($('#stopNav')) $('#stopNav').onclick = () => { current.nav=false; showPlace(pl, false); };
  if ($('#setRoom')) $('#setRoom').onclick = () => { const v = prompt('Room number (saved only on this phone):', room()); if (v!==null){ localStorage.setItem('room', v.trim()); refreshHome();
      HOME.name = `Your room — Building 80${room()?' · Room '+room():''}`; showPlace(HOME); } };
  $('#back').onclick = () => inTonight ? tonightSheet(tonightDay) : activeCat ? runQuery({cat:activeCat}) : $('#q').value ? runQuery({text:$('#q').value}) : clearAll();
}
let lastReroute = 0;
function maybeReroute(){

// ---------- tonight's activities (schedule.json; built-in copy used when offline) ----------
// A "resort day" runs 05:00 → 05:00, so the 00:00 disco belongs to the evening before.
let SCHED = window.SCHEDULE || {every_day:[], days:{}};
const DAY_START = 300;
const PLACE_BY_ID = new Map(D.places.map(p => [p.id, p]));
const nowDate = () => window.FAKE_NOW ? new Date(window.FAKE_NOW) : new Date();
function addDays(ds, n){ const d = new Date(ds+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function resortNow(){
  const parts = new Intl.DateTimeFormat('en-CA',{timeZone:'America/Santo_Domingo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(nowDate());
  const g = t => parts.find(x => x.type===t).value;
  let date = `${g('year')}-${g('month')}-${g('day')}`, min = (+g('hour')%24)*60 + +g('minute');
  if (min < DAY_START) { date = addDays(date,-1); min += 1440; }
  return {date, min};
}
const dayName = (ds, long) => new Date(ds+'T12:00:00Z').toLocaleDateString('en-US',{timeZone:'UTC',weekday:long?'long':'short',month:'short',day:'numeric'});
const t2m = s => { const m = String(s||'').trim().match(/^(\d{1,2})[:.](\d{2})$/); return m && +m[1] < 24 && +m[2] < 60 ? (+m[1])*60 + +m[2] : null; };
const hhmm = m => `${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const ampm = m => { const h = Math.floor(m/60)%24, mm = m%60; return !h && !mm ? 'midnight' : h === 12 && !mm ? 'noon' : `${h%12||12}${mm?':'+String(mm).padStart(2,'0'):''} ${h<12?'am':'pm'}`; };
function venueOf(v){ // null = no venue given; undefined = not one of your places (activity is hidden)
  if (!v) return null; if (PLACE_BY_ID.has(v)) return PLACE_BY_ID.get(v);
  const s = String(v).trim().toLowerCase(); return D.places.find(p => p.name.toLowerCase() === s);
}
function actsFor(ds){
  const key = a => String(a.title||'').trim().toLowerCase();
  const list = (SCHED.every_day||[]).map(a => ({...a, regular:true}));
  for (const a of ((SCHED.days||{})[ds] || [])) {
    const j = list.findIndex(x => x.regular && key(x) === key(a));
    if (a.cancelled) { if (j >= 0) list.splice(j,1); continue; }
    if (j >= 0) list[j] = {...list[j], ...a, regular:false}; else list.push({...a, regular:false});
  }
  const out = [];
  for (const a of list) {
    let s = t2m(a.time); if (s == null || !a.title) continue;
    if (s < DAY_START) s += 1440;
    let e = t2m(a.end); if (e != null) { while (e <= s) e += 1440; }
    const pl = venueOf(a.venue); if (pl === undefined) continue;
    out.push({...a, s, e, pl});
  }
  return out.sort((x,y) => x.s - y.s);
}
const actTimeText = a => a.e != null ? `${hhmm(a.s)}–${hhmm(a.e)}` : hhmm(a.s);
function actState(a, ds){
  const now = resortNow();
  if (ds !== now.date) return ds > now.date ? {k:'later', txt: `${dayName(ds,true)} at ${ampm(a.s)}`} : {k:'ended', txt:'Ended'};
  const t = now.min, end = a.e ?? a.s + 60;
  if (t >= a.s && t < end) return {k:'now', txt: a.e != null ? `On now · until ${hhmm(a.e)}` : `Started ${t-a.s} min ago`};
  if (t < a.s) { const d = a.s - t; return {k:'soon', txt: d < 60 ? `Starts in ${d} min` : d < 180 ? `Starts in ${Math.floor(d/60)} h ${d%60 ? d%60+' min' : ''}`.trim() : `Starts at ${ampm(a.s)}`}; }
  return {k:'ended', txt:'Ended'};
}
function tonightTeaser(){
  const now = resortNow(), acts = actsFor(now.date).map(a => ({a, st: actState(a, now.date)})).filter(x => x.st.k !== 'ended');
  if (!acts.length) return '';
  const on = acts.filter(x => x.st.k === 'now').sort((x,y) => y.a.s - x.a.s), nx = acts.find(x => x.st.k === 'soon');
  const bits = [...on.slice(0,2).map(x => `<b>${esc(x.a.title)}</b> on now`), ...(nx ? [`next: <b>${esc(nx.a.title)}</b> ${hhmm(nx.a.s)}`] : [])];
  return `<div class="tnote">🌙 <span>${bits.join(' · ')}</span><button id="tnGo">Tonight</button></div>`;
}
function tonightSheet(ds, refresh=false){
  const now = resortNow(); ds = ds || now.date; tonightDay = ds;
  activeCat = 'tonight'; actCtx = null; current = null;
  chips.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.k === 'tonight'));
  const isToday = ds === now.date, last = SCHED.stay_until && SCHED.stay_until > now.date ? SCHED.stay_until : now.date;
  const st = startPoint(), T = dijkstra(st.snap);
  const acts = actsFor(ds).map(a => ({a, st: actState(a, ds), r: a.pl ? routeTo(st, T, a.pl) : null}));
  const live = acts.filter(x => x.st.k !== 'ended'), past = acts.filter(x => x.st.k === 'ended');
  const nextIdx = live.findIndex(x => x.st.k === 'soon');
  const feat = live.filter(x => x.st.k === 'now' && x.a.pl).sort((x,y) => y.a.s - x.a.s)[0] || live.find(x => x.a.pl);
  tonightVenues = [...new Set(live.filter(x => x.a.pl).map(x => x.a.pl))];
  highlight(tonightVenues, feat && feat.a.pl.id);
  routeLayer.clearLayers(); if (feat && isToday) drawRoute(feat.r, feat.a.pl, false);
  // time labels beside each venue pin
  actLabels.clearLayers(); const byVenue = new Map();
  live.forEach(x => { if (!x.a.pl) return;   // venues within 90 m share one stacked label
    let key = [...byVenue.keys()].find(p => dist(p.ll, x.a.pl.ll) < 90) || x.a.pl;
    if (!byVenue.has(key)) byVenue.set(key, []); byVenue.get(key).push(x); });
  byVenue.forEach((xs, pl) => {
    const lines = xs.slice(0,3).map(x => `<div>${hhmm(x.a.s)} ${esc(x.a.short || (x.a.title.length > 16 ? x.a.title.slice(0,15)+'…' : x.a.title))}</div>`).join('') + (xs.length > 3 ? `<div>+${xs.length-3} more</div>` : '');
    const at = xs.map(x => x.a.pl).reduce((m, p) => p.ll[1] > m.ll[1] ? p : m);   // label sits right of the eastmost pin
    L.marker(at.ll, {icon: L.divIcon({className:'', iconSize:null, iconAnchor:[-24,10], html:`<div class="actlbl ${xs.some(x=>x.st.k==='now')?'live':''}">${lines}</div>`}), zIndexOffset:400})
      .on('click', () => xs.length > 1 ? null : openAct(xs[0].a, ds)).addTo(actLabels);
  });
  const row = (x, i) => { const {a, st: s, r} = x;
    const badge = s.k === 'now' ? '<span class="badge">ON NOW</span>' : (isToday && i === nextIdx) ? '<span class="badge next">NEXT</span>' : '';
    return `<div class="row act ${s.k==='ended'?'past':''}" data-i="${acts.indexOf(x)}"><div class="time">${hhmm(a.s)}<small>${ampm(a.s)}</small></div>
      <div class="main"><div class="name">${badge}${esc(a.title)}</div>
      <div class="sub">${a.pl ? `<span class="tag" style="background:${SEC[a.pl.sec].h}">${SEC[a.pl.sec].n}</span>${esc(a.pl.name)}` : esc(a.where || 'Location: see the entertainment panel')}</div>
      <div class="sub">${isToday ? `<span class="${s.k==='now'?'open':''}">${esc(s.txt)}</span>` : ''}${a.e!=null && !(isToday && s.k==='now') ? `${isToday?' · ':''}${hhmm(a.s)}–${hhmm(a.e)}` : ''}${a.note?' · '+esc(a.note):''}</div></div>
      ${r ? `<div class="walk">${Math.max(1,Math.round(r.meters/WALK_M_PER_MIN))} min<small>${Math.round(r.meters)} m</small></div>` : ''}</div>`; };
  const title = isToday ? (now.min >= 16*60 ? 'Tonight' : 'Today') : dayName(ds, true);
  const sc = refresh ? body.scrollTop : 0;
  setSheet(`<div class="daynav"><button id="dPrev" ${ds <= now.date ? 'disabled' : ''} aria-label="Previous day">‹</button>
      <h2>🌙 ${title}${isToday ? ` <span class="hint">· ${dayName(ds, true)}</span>` : ''}</h2>
      <button id="dNext" ${ds >= last ? 'disabled' : ''} aria-label="Next day">›</button></div>
    ${acts.length ? '' : '<div class="hint">Nothing listed for this day yet.</div>'}
    ${live.map(row).join('')}
    ${past.length ? `<div class="hint" style="margin-top:10px">Earlier ${isToday?'today':''}</div>${past.map(row).join('')}` : ''}
    <div class="note">${(SCHED.days||{})[ds]?.length ? `Includes the day's program${SCHED.updated?` (updated ${esc(SCHED.updated)})`:''}.` : 'Showing the daily regulars from the hotel guide.'}
      To add the full program, send <b>Hermes</b> a photo of the daily activity sheet or the hotel app screen. Times can change, so check the entertainment panels too.</div>`);
  if (refresh) body.scrollTop = sc;
  body.querySelectorAll('.row.act').forEach(el => el.onclick = () => openAct(acts[+el.dataset.i].a, ds));
  $('#dPrev').onclick = () => tonightSheet(addDays(ds,-1));
  $('#dNext').onclick = () => tonightSheet(addDays(ds, 1));
  if (!refresh) fitTo([...(st.ll ? [st.ll] : []), ...tonightVenues.map(p => p.ll), D.home.ll]);
}
function openAct(a, ds){
  if (!a.pl) return alert(`${a.title} · ${actTimeText(a)}\n${a.where || 'Location: see the entertainment panel.'}${a.note ? '\n'+a.note : ''}`);
  actCtx = {a, ds}; showPlace(a.pl);
}
function refreshTonight(){
  if (activeCat === 'tonight' && !actCtx) tonightSheet(tonightDay, true);
  else if (!activeCat && !current && !$('#q').value) {
    const t = document.querySelector('.tnote'), fresh = tonightTeaser();
    if (!t) { if (fresh) homeSheet(); } else if (t.outerHTML !== fresh) { if (fresh) { t.outerHTML = fresh; $('#tnGo').onclick = () => tonightSheet(); } else t.remove(); }
  }
}
setInterval(refreshTonight, 60000);
if (/^https?:/.test(location.protocol))
  fetch('schedule.json', {cache:'no-cache'}).then(r => r.ok ? r.json() : null)
    .then(j => { if (j && (j.every_day || j.days)) { SCHED = j; refreshTonight(); } }).catch(() => {});

homeSheet();
map.fitBounds(L.latLngBounds([D.home.ll,[18.7205,-68.4675],[18.7275,-68.4600]]), {paddingTopLeft:[10,110], paddingBottomRight:[10,150]});

// ---------- offline ----------
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
